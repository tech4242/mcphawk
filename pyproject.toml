[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcphawk"
version = "1.0.0"
description = "DevTools for MCP: see the real traffic between your MCP clients and servers, what it costs in context, and what went wrong."
authors = [
  { name = "tech4242" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "debugging", "devtools", "llm", "agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "mcp>=2.2.0,<3",
  "psutil>=6.0.0",
  "scapy>=2.5.0",
  "typer>=0.16.0",
  "uvicorn[standard]>=0.35.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.urls]
"Homepage" = "https://github.com/tech4242/mcphawk"
"Bug Tracker" = "https://github.com/tech4242/mcphawk/issues"

[project.scripts]
mcphawk = "mcphawk.cli:app"

[tool.setuptools]
packages = {find = {where = ["."], include = ["mcphawk*"]}}
include-package-data = true

[tool.setuptools.package-data]
"mcphawk.web" = ["static/**/*", "static/*", "static/assets/*"]

[tool.ruff]
# Exclude a variety of commonly ignored directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    ".venv",
    "frontend",
]

# Same as Black
line-length = 88

# Oldest supported Python
target-version = "py310"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # Line too long - we'll handle this case by case
    "A002",  # Argument shadowing Python builtin
]

# Allow autofix for all enabled rules (when `--fix`) is provided
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore imports in __init__.py files
"__init__.py" = ["F401", "E402"]
# Ignore assert statements in tests
"test_*.py" = ["S101", "E712"]
"tests/*.py" = ["S101", "E712"]
"tests/**/*.py" = ["S101", "E712"]
# Typer declares options as argument defaults
"mcphawk/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["mcphawk"]
omit = ["examples/*", "*/examples/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true